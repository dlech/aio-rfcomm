[project]
name = "aio-rfcomm"
version = "0.1.0"
description = "Cross-platform asyncio RFCOMM (Bluetooth Classic serial port) for Linux, macOS and Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "David Lechner", email = "david@pybricks.com" }
]
requires-python = ">=3.11"
dependencies = [
    # 4.4 is where typing_extensions.override arrived; typing.override itself
    # needs Python 3.12, which is above this project's floor.
    "typing-extensions>=4.4",
    # 4.0 is where dbus_fast.annotations arrived; the Linux backend uses those
    # rather than bare D-Bus signature strings.
    "dbus-fast>=4 ; sys_platform == 'linux'",
    "rubicon-objc>=0.5.3 ; sys_platform == 'darwin'",
    "winrt-windows-devices-bluetooth>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-devices-bluetooth-rfcomm>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-devices-enumeration>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-networking>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-networking-sockets>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-storage>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1 ; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "pyright>=1.1.408",
    "ruff>=0.13.0",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
]

[tool.uv]
default-groups = ["lint", "test"]

# Prototypes are verbatim copies of working spikes from other repositories,
# and typings/ holds stubs for rubicon-objc, which ships none of its own,
# imported as a git subtree. Both are kept unmodified, so neither is linted
# or type checked here.
[tool.ruff]
# extend-exclude, not exclude: the latter replaces ruff's own defaults, which
# would drag .venv into the lint as soon as there is no .gitignore to fall back
# on -- as happens in a copy of the tree without its .git directory.
extend-exclude = ["prototypes", "typings"]

[tool.pyright]
exclude = ["prototypes", ".venv"]
# typings/ is pyright's default stub path, and is where the rubicon-objc
# stubs land; it is named here only to keep them out of the check itself.
ignore = ["typings"]
# rubicon-objc ships no type information of its own, which is the whole
# reason those stubs are here. Saying so once is enough.
reportMissingModuleSource = "none"
# An overriding method says so, rather than leaving a reader to go and
# check for themselves. Enforced here rather than left to review.
reportImplicitOverride = "error"

# Structured concurrency, enforced mechanically rather than by review.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_task".msg = "Use asyncio.TaskGroup (structured concurrency rule)."
"asyncio.ensure_future".msg = "Use asyncio.TaskGroup (structured concurrency rule)."
"asyncio.gather".msg = "Use asyncio.TaskGroup."
"asyncio.wait".msg = "Use asyncio.TaskGroup plus a timeout."
"asyncio.set_event_loop_policy".msg = "Never change the caller's event loop policy."

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only our own tests, never anything that turns up under a subtree.
testpaths = ["tests"]
# These tests exist to catch hangs and deadlocks, so a hang must fail rather
# than stall the run.
timeout = 10
# A warning is a defect until proven otherwise -- an un-awaited coroutine or an
# unclosed transport shows up here and nowhere else.
filterwarnings = ["error"]

[tool.ruff.lint.per-file-ignores]
# Tests stand in for a second, misbehaving caller, which is exactly what the
# structured concurrency rule forbids in the library itself.
"tests/**" = ["TID251"]
