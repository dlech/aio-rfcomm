name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.15 is still a release candidate, which uv picks when no final
        # release matches.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # winrt has no cp315 wheels yet, so it would be built from source.
        exclude:
          - os: windows-latest
            python: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest
      # Every file on every OS. A backend's modules start with a platform
      # assert that type checking for another OS takes as unreachable.
      - run: uv run --locked pyright
